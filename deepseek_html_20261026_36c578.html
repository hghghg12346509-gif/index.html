<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра «Огонь»</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #1a0000; /* Темно-багровый фон */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: crosshair;
            transition: background-color 0.3s;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- ОГНЕННЫЙ КРУГ --- */
        #circle {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: rgba(255, 69, 0, 0.15); /* Полупрозрачный оранжевый */
            border: 4px solid #ff4500; /* Оранжево-красный */
            border-radius: 50%;
            /* Свечение и пульсация как у огня */
            box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff4500;
            transform: translate(-50%, -50%);
            pointer-events: none;
            /* Плавное изменение размера */
            transition: width 0.1s linear, height 0.1s linear;
            animation: firePulse 1.5s infinite alternate;
        }

        @keyframes firePulse {
            0% { box-shadow: 0 0 20px #ff0000, inset 0 0 10px #ff4500; }
            100% { box-shadow: 0 0 50px #ff4500, inset 0 0 30px #ff0000; }
        }

        /* Линия, показывающая направление (тоже огненная) */
        .trajectory-line {
            position: absolute;
            height: 6px;
            background-color: #ffaa00;
            box-shadow: 0 0 20px #ff4500;
            border-radius: 3px;
            transform-origin: 0 50%;
            pointer-events: none;
            z-index: 15;
            opacity: 0.9;
            animation: flash 0.3s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffaa00;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 15px #ff0000;
            z-index: 5;
        }

        /* --- ЭКРАНЫ --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }

        .overlay h1 {
            font-size: 54px;
            margin-bottom: 10px;
            color: #ff4500;
            text-shadow: 0 0 30px #ff0000;
        }

        .overlay p {
            font-size: 20px;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.5;
            color: #ffccaa;
        }

        .overlay button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0000, #ff4500);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px #ff4500;
        }

        .overlay button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px #ff0000;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 180px;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 0 0 40px #ff0000;
            z-index: 20;
            pointer-events: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- КРАСНАЯ ЗАЛИВКА ЭКРАНА ПРИ ПРОИГРЫШЕ --- */
        #red-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff0000;
            opacity: 0;
            pointer-events: none;
            z-index: 100; /* Поверх всего */
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="score-display">Время: 0.0с</div>
        <div id="countdown" class="hidden">3</div>
        <div id="circle" class="hidden"></div>

        <div id="start-screen" class="overlay">
            <h1>🔥 Игра «Огонь» 🔥</h1>
            <p>Удерживайте курсор внутри пылающего круга.<br>У вас есть 1.5 секунды, чтобы увидеть, <b>куда полетит искра</b>.<br>Круг будет медленно сужаться и ускоряться!</p>
            <button id="start-btn">Зажечь!</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: #ff0000; text-shadow: 0 0 30px #ff0000;">Вы сгорели!</h1>
            <p>Вы продержались в огне: <span id="final-score">0.0</span> секунд</p>
            <button id="restart-btn">Попробовать снова</button>
        </div>
    </div>

    <!-- Слой для красной вспышки -->
    <div id="red-flash"></div>

    <script>
        const circle = document.getElementById('circle');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const countdownEl = document.getElementById('countdown');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreSpan = document.getElementById('final-score');
        const gameArea = document.getElementById('game-area');
        const redFlash = document.getElementById('red-flash');

        let isPlaying = false;
        let isPreview = false;
        let previewTimer = null;
        
        let mouseX = window.innerWidth / 2; 
        let mouseY = window.innerHeight / 2;
        
        let circleX = 0, circleY = 0;
        let radius = 100;
        let speedX = 5;
        let speedY = 5;
        
        let startTime = 0;
        let currentScore = 0;
        let animationFrameId;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function prepareGame() {
            isPlaying = false;
            isPreview = false;
            clearTimeout(previewTimer);
            cancelAnimationFrame(animationFrameId);
            
            // Убираем красную заливку
            redFlash.style.opacity = '0';

            const oldLine = document.querySelector('.trajectory-line');
            if (oldLine) oldLine.remove();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            circle.classList.add('hidden');
            scoreDisplay.textContent = 'Время: 0.0с';
            
            countdownEl.classList.remove('hidden');
            let count = 3;
            countdownEl.textContent = count;
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');
                    startActualGame();
                }
            }, 1000);
        }

        function startActualGame() {
            isPlaying = true;
            isPreview = true; 
            radius = 100; // Стартовый радиус
            currentScore = 0;
            
            // Случайное направление
            const randomAngle = Math.random() * Math.PI * 2;
            const startSpeed = 6;
            speedX = Math.cos(randomAngle) * startSpeed;
            speedY = Math.sin(randomAngle) * startSpeed;

            // Круг появляется под мышкой
            circleX = mouseX;
            circleY = mouseY;

            // Защита от выхода за края
            if (circleX - radius < 0) circleX = radius;
            if (circleX + radius > window.innerWidth) circleX = window.innerWidth - radius;
            if (circleY - radius < 0) circleY = radius;
            if (circleY + radius > window.innerHeight) circleY = window.innerHeight - radius;

            circle.style.width = (radius * 2) + 'px';
            circle.style.height = (radius * 2) + 'px';
            circle.style.left = circleX + 'px';
            circle.style.top = circleY + 'px';
            circle.classList.remove('hidden');

            // Огненная линия направления
            const line = document.createElement('div');
            line.classList.add('trajectory-line');
            line.style.left = circleX + 'px';
            line.style.top = (circleY - 3) + 'px';
            line.style.width = (radius - 10) + 'px';
            line.style.transform = `rotate(${randomAngle}rad)`;
            gameArea.appendChild(line);

            // Через 1.5 секунды убираем линию и запускаем
            previewTimer = setTimeout(() => {
                isPreview = false;
                line.remove();
                startTime = Date.now(); 
                updateGame();
            }, 1500); 
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            circle.classList.add('hidden');
            
            // ВКЛЮЧАЕМ КРАСНЫЙ ЭКРАН (как вы и просили)
            redFlash.style.opacity = '0.8'; // Экран становится красным
            
            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
                finalScoreSpan.textContent = currentScore.toFixed(1);
            }, 300); // Небольшая задержка, чтобы игрок увидел вспышку
        }

        function updateGame() {
            if (!isPlaying) return;

            if (!isPreview) {
                // Движение
                circleX += speedX;
                circleY += speedY;

                // Отскок от стен
                if (circleX - radius <= 0 || circleX + radius >= window.innerWidth) {
                    speedX *= -1;
                }
                if (circleY - radius <= 0 || circleY + radius >= window.innerHeight) {
                    speedY *= -1;
                }

                // Проверка на проигрыш
                const dist = Math.sqrt(Math.pow(mouseX - circleX, 2) + Math.pow(mouseY - circleY, 2));
                if (dist > radius) {
                    gameOver();
                    return;
                }

                // Счет
                currentScore = (Date.now() - startTime) / 1000;
                scoreDisplay.textContent = `Время: ${currentScore.toFixed(1)}с`;

                // --- ПЛАВНОЕ И МЕДЛЕННОЕ СУЖЕНИЕ ---
                // Каждый кадр (60 раз в секунду) круг сужается на 0.03 пикселя
                if (radius > 30) { // Не даем ему стать слишком крошечным (минимум 30px)
                    radius -= 0.03; 
                    circle.style.width = (radius * 2) + 'px';
                    circle.style.height = (radius * 2) + 'px';
                }

                // Ускорение каждые 5 секунд
                if (Math.floor(currentScore) > 0 && Math.floor(currentScore) % 5 === 0 && Math.floor(currentScore) > (circle.lastSpeedUpdate || 0)) {
                    circle.lastSpeedUpdate = Math.floor(currentScore);
                    
                    if (Math.abs(speedX) < 25) {
                        speedX *= 1.12;
                        speedY *= 1.12;
                    }
                }
            }

            circle.style.left = circleX + 'px';
            circle.style.top = circleY + 'px';

            animationFrameId = requestAnimationFrame(updateGame);
        }

        startBtn.addEventListener('click', prepareGame);
        restartBtn.addEventListener('click', prepareGame);
    </script>
</body>
</html>
